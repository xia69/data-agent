<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DataAgent</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #1a1a2e; color: #eee; height: 100vh; display: flex; flex-direction: column; }
.header { background: #16213e; padding: 16px 24px; font-size: 18px; font-weight: 600; border-bottom: 1px solid #0f3460; }
.main { flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 16px; }
.msg { max-width: 80%; padding: 12px 16px; border-radius: 12px; line-height: 1.6; }
.msg.user { align-self: flex-end; background: #0f3460; }
.msg.agent { align-self: flex-start; background: #16213e; }
.steps { display: flex; flex-wrap: wrap; gap: 8px; padding: 8px 0; }
.step { display: flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 20px; background: #16213e; font-size: 13px; opacity: 0.4; transition: all .3s; }
.step .dot { width: 8px; height: 8px; border-radius: 50%; background: #555; }
.step.running { opacity: 1; }
.step.running .dot { background: #f0ad4e; animation: pulse .8s infinite; }
.step.success { opacity: 1; }
.step.success .dot { background: #5cb85c; }
.step.error { opacity: 1; }
.step.error .dot { background: #d9534f; }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .3; } }
.result { background: #16213e; border-radius: 12px; padding: 16px; overflow-x: auto; }
.result table { width: 100%; border-collapse: collapse; font-size: 14px; }
.result th, .result td { padding: 8px 12px; text-align: left; border-bottom: 1px solid #0f3460; }
.result th { color: #888; font-weight: 500; }
.sql-block { background: #0d1117; border-radius: 8px; padding: 12px 16px; font-family: "Fira Code", monospace; font-size: 13px; white-space: pre-wrap; color: #7ee787; margin: 8px 0; }
.footer { padding: 16px 24px; background: #16213e; border-top: 1px solid #0f3460; display: flex; gap: 12px; }
.footer input { flex: 1; padding: 10px 16px; border-radius: 8px; border: 1px solid #0f3460; background: #1a1a2e; color: #eee; font-size: 14px; outline: none; }
.footer input:focus { border-color: #0f3460; background: #0d0d1a; }
.footer button { padding: 10px 24px; border-radius: 8px; border: none; background: #0f3460; color: #eee; font-size: 14px; cursor: pointer; transition: .2s; }
.footer button:hover { background: #1a4a7a; }
.footer button:disabled { opacity: .4; cursor: not-allowed; }
.error-msg { color: #d9534f; padding: 12px; background: rgba(217,83,79,.1); border-radius: 8px; }
</style>
</head>
<body>
<div class="header">DataAgent — 智能数据查询</div>
<div class="main" id="messages"></div>
<div class="footer">
  <input id="input" placeholder="输入问题，例如：华北地区销售总额" onkeydown="if(event.key==='Enter') send()">
  <button id="sendBtn" onclick="send()">发送</button>
</div>

<script>
const API = 'http://localhost:8000/api/query';
const NODES = ['提取关键词','召回字段','召回指标','召回取值','合并召回信息','筛选指标','筛选表','添加额外上下文','生成SQL','校验SQL','修正SQL','执行SQL'];

function send() {
  const q = document.getElementById('input').value.trim();
  if (!q) return;
  document.getElementById('input').value = '';
  document.getElementById('sendBtn').disabled = true;

  const msgDiv = document.getElementById('messages');
  const userMsg = el('div', {class:'msg user'}, q);
  const agentMsg = el('div', {class:'msg agent'});
  const stepRow = el('div', {class:'steps'});
  const stepMap = {};
  NODES.forEach(name => {
    const s = el('div', {class:'step'}, [el('span', {class:'dot'}), el('span', {}, name)]);
    stepRow.appendChild(s);
    stepMap[name] = s;
  });
  const contentArea = el('div', {});
  agentMsg.appendChild(stepRow);
  agentMsg.appendChild(contentArea);
  msgDiv.appendChild(userMsg);
  msgDiv.appendChild(agentMsg);
  msgDiv.scrollTop = msgDiv.scrollHeight;

  fetch(API, { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({question: q}) })
    .then(r => {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const reader = r.body.getReader();
      const decoder = new TextDecoder();
      let buffer = '';
      function pump() {
        reader.read().then(({done, value}) => {
          if (done) { document.getElementById('sendBtn').disabled = false; return; }
          buffer += decoder.decode(value, {stream: true});
          const lines = buffer.split('\n');
          buffer = lines.pop() || '';
          lines.forEach(line => {
            if (!line.startsWith('data: ')) return;
            const payload = line.slice(6);
            try {
              const evt = JSON.parse(payload);
              if (evt.type === 'progress') {
                const step = stepMap[evt.step];
                if (!step) return;
                step.className = 'step ' + evt.status;
              } else if (evt.type === 'result') {
                renderResult(contentArea, evt.data);
              } else if (evt.type === 'error') {
                contentArea.appendChild(el('div', {class:'error-msg'}, evt.message));
              }
            } catch {
              // plain text, like SQL display
              if (payload.trim()) {
                contentArea.appendChild(el('div', {class:'sql-block'}, payload));
              }
            }
          });
          msgDiv.scrollTop = msgDiv.scrollHeight;
          pump();
        });
      }
      pump();
    })
    .catch(err => {
      contentArea.appendChild(el('div', {class:'error-msg'}, '请求失败: ' + err.message));
      document.getElementById('sendBtn').disabled = false;
    });
}

function renderResult(container, data) {
  if (!data || !data.length) return;
  const cols = Object.keys(data[0]);
  const table = el('table', {},
    el('thead', {}, el('tr', {}, cols.map(c => el('th', {}, c)))),
    el('tbody', {}, data.map(row => el('tr', {}, cols.map(c => el('td', {}, String(row[c] ?? ''))))))
  );
  const wrapper = el('div', {class:'result'}, table);
  container.appendChild(wrapper);
}

function el(tag, attrs, ...children) {
  const e = document.createElement(tag);
  if (attrs) Object.entries(attrs).forEach(([k,v]) => { if (v != null) e.setAttribute(k, v); });
  children.forEach(c => {
    if (typeof c === 'string') e.appendChild(document.createTextNode(c));
    else if (Array.isArray(c)) c.forEach(cc => e.appendChild(typeof cc === 'string' ? document.createTextNode(cc) : cc));
    else if (c instanceof Node) e.appendChild(c);
  });
  return e;
}
</script>
</body>
</html>
